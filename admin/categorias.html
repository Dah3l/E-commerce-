<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Panel Admin</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header"><a href="/admin/dashboard.html" class="admin-sidebar__logo">🛒 Admin Panel</a></div>
      <nav class="admin-sidebar__nav">
        <ul class="admin-nav__list">
          <li class="admin-nav__item"><a href="/admin/dashboard.html" class="admin-nav__link"><span class="admin-nav__icon">📊</span>Dashboard</a></li>
          <li class="admin-nav__item"><a href="/admin/productos.html" class="admin-nav__link"><span class="admin-nav__icon">📦</span>Productos</a></li>
          <li class="admin-nav__item"><a href="/admin/categorias.html" class="admin-nav__link active"><span class="admin-nav__icon">📂</span>Categorías</a></li>
          <li class="admin-nav__item"><a href="/admin/configuracion.html" class="admin-nav__link"><span class="admin-nav__icon">⚙️</span>Configuración</a></li>
          <li class="admin-nav__item" style="margin-top: 20px;"><a href="/" class="admin-nav__link" target="_blank"><span class="admin-nav__icon">🏪</span>Ver Tienda</a></li>
        </ul>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-header">
        <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú">☰</button>
        <h1 class="admin-header__title">Gestión de Categorías</h1>
        <div class="admin-header__actions">
          <button class="btn btn--primary" id="btnNuevaCategoria">➕ Nueva Categoría</button>
          <button class="btn btn--secondary logout-btn" id="btnLogout">🚪 Salir</button>
        </div>
      </header>
      <div class="container" style="padding: var(--spacing-6);">
        <div class="admin-table-container">
          <table class="admin-table">
            <thead><tr><th>Nombre</th><th>Slug</th><th>Orden</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="categoriasTableBody"><tr><td colspan="5" style="text-align: center; padding: 40px;">Cargando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { isAuthenticated, logout } from '../js/auth.js';
    import { supabase } from '../js/supabase-client.js';
    import { showToast, showConfirmModal, showFormModal, escapeHtml } from '../js/ui.js';
    import { slugify } from '../js/utils.js';
    import { clearConfigCaches } from '../js/config-negocio.js';

    if (!isAuthenticated()) window.location.href = '/admin/login.html';

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('adminSidebar').classList.toggle('admin-sidebar--open');
    });
    document.getElementById('btnLogout').addEventListener('click', logout);

    let categorias = [];

    async function loadCategorias() {
      const { data, error } = await supabase.from('categorias').select('*').order('orden', { ascending: true });
      if (error) {
        console.error('Error cargando categorías:', error);
        showToast('No se pudieron cargar las categorías', 'error');
        return;
      }
      categorias = data || [];
      renderCategorias();
    }

    function renderCategorias() {
      const tbody = document.getElementById('categoriasTableBody');
      if (categorias.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No hay categorías. Crea la primera con "➕ Nueva Categoría".</td></tr>';
        return;
      }
      tbody.innerHTML = categorias.map(c => `<tr>
        <td>${escapeHtml(c.nombre)}</td>
        <td><code>${escapeHtml(c.slug)}</code></td>
        <td>${c.orden ?? '-'}</td>
        <td><span class="badge ${c.activa ? 'badge--success' : 'badge--danger'}">${c.activa ? 'Activa' : 'Inactiva'}</span></td>
        <td class="admin-table__actions">
          <button class="admin-table__btn admin-table__btn--edit" data-edit="${c.id}" title="Editar">✏️</button>
          <button class="admin-table__btn admin-table__btn--delete" data-delete="${c.id}" title="Eliminar">🗑️</button>
        </td>
      </tr>`).join('');
    }

    document.getElementById('categoriasTableBody').addEventListener('click', (e) => {
      const editBtn = e.target.closest('[data-edit]');
      const delBtn = e.target.closest('[data-delete]');
      if (editBtn) openCategoriaModal(editBtn.dataset.edit);
      if (delBtn) deleteCategoria(delBtn.dataset.delete);
    });

    document.getElementById('btnNuevaCategoria').addEventListener('click', () => openCategoriaModal());

    function categoriaFields(c = {}) {
      return [
        { id: 'nombre', label: 'Nombre', type: 'text', required: true, value: c.nombre || '' },
        { id: 'slug', label: 'Slug (para URLs)', type: 'text', required: true, value: c.slug || '' },
        { id: 'descripcion', label: 'Descripción', type: 'textarea', value: c.descripcion || '' },
        { id: 'orden', label: 'Orden (número menor = aparece antes)', type: 'number', min: 0, value: c.orden ?? 0 },
        { id: 'activa', label: 'Activa (visible en la tienda)', type: 'checkbox', value: c.activa !== false }
      ];
    }

    async function guardarCategoria(values, existing) {
      const nombre = values.nombre.trim();
      const data = {
        nombre,
        slug: values.slug.trim() ? slugify(values.slug) : slugify(nombre),
        descripcion: values.descripcion.trim() || null,
        orden: values.orden !== '' ? parseInt(values.orden, 10) : 0,
        activa: !!values.activa
      };

      if (existing) {
        const { error } = await supabase.from('categorias').update(data).eq('id', existing.id);
        if (error) {
          console.error(error);
          return { error: 'Error guardando cambios: ' + error.message };
        }
      } else {
        const { error } = await supabase.from('categorias').insert([data]);
        if (error) {
          console.error(error);
          return { error: 'Error creando categoría: ' + error.message };
        }
      }
      clearConfigCaches();
      return {};
    }

    function openCategoriaModal(id = null) {
      const c = id ? categorias.find(x => x.id === id) : null;
      showFormModal({
        title: c ? 'Editar Categoría' : 'Nueva Categoría',
        fields: categoriaFields(c || {}),
        onSave: async (values) => {
          const result = await guardarCategoria(values, c);
          if (!result.error) {
            showToast(c ? 'Categoría actualizada ✓' : 'Categoría creada ✓', 'success');
            loadCategorias();
          }
          return result;
        }
      });
    }

    async function deleteCategoria(id) {
      const c = categorias.find(x => x.id === id);
      const ok = await showConfirmModal({
        title: 'Eliminar Categoría',
        message: `¿Seguro que quieres eliminar "${c?.nombre || 'esta categoría'}"? Los productos de esta categoría quedarán sin categoría.`,
        confirmText: 'Eliminar',
        type: 'danger'
      });
      if (!ok) return;
      const { error } = await supabase.from('categorias').delete().eq('id', id);
      if (error) {
        console.error(error);
        showToast('Error eliminando: ' + error.message, 'error');
      } else {
        showToast('Categoría eliminada', 'success');
        clearConfigCaches();
        loadCategorias();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadCategorias);
    } else {
      loadCategorias();
    }
  </script>
</body>
</html>
