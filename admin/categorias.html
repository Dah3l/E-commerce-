<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Panel Admin</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header"><a href="/admin/dashboard.html" class="admin-sidebar__logo">🛒 Admin Panel</a></div>
      <nav class="admin-sidebar__nav">
        <ul class="admin-nav__list">
          <li class="admin-nav__item"><a href="/admin/dashboard.html" class="admin-nav__link"><span class="admin-nav__icon">📊</span>Dashboard</a></li>
          <li class="admin-nav__item"><a href="/admin/productos.html" class="admin-nav__link"><span class="admin-nav__icon">📦</span>Productos</a></li>
          <li class="admin-nav__item"><a href="/admin/categorias.html" class="admin-nav__link active"><span class="admin-nav__icon">📂</span>Categorías</a></li>
          <li class="admin-nav__item"><a href="/admin/configuracion.html" class="admin-nav__link"><span class="admin-nav__icon">⚙️</span>Configuración</a></li>
          <li class="admin-nav__item" style="margin-top: 20px;"><a href="/" class="admin-nav__link" target="_blank"><span class="admin-nav__icon">🏪</span>Ver Tienda</a></li>
        </ul>
      </nav>
    </aside>
    <main class="admin-main">
      <header class="admin-header">
        <button class="admin-sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <h1 class="admin-header__title">Gestión de Categorías</h1>
        <div class="admin-header__actions">
          <button class="btn btn--primary" onclick="openCategoriaModal()">➕ Nueva Categoría</button>
          <button class="btn btn--secondary logout-btn" onclick="logout()">🚪 Salir</button>
        </div>
      </header>
      <div class="container" style="padding: var(--spacing-6);">
        <div class="admin-table-container">
          <table class="admin-table">
            <thead><tr><th>Nombre</th><th>Slug</th><th>Orden</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="categoriasTableBody"><tr><td colspan="5" style="text-align: center; padding: 40px;">Cargando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="categoriaModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal__header"><h2 class="modal__title" id="modalTitle">Nueva Categoría</h2><button class="modal__close" onclick="closeCategoriaModal()">&times;</button></div>
      <div class="modal__body">
        <form id="categoriaForm">
          <input type="hidden" id="categoriaId">
          <div class="form-group"><label class="form-label form-label--required">Nombre</label><input type="text" class="form-input" id="nombre" required oninput="generarSlug()"></div>
          <div class="form-group"><label class="form-label form-label--required">Slug</label><input type="text" class="form-input" id="slug" required></div>
          <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-textarea" id="descripcion"></textarea></div>
          <div class="form-group"><label class="form-label">Orden</label><input type="number" class="form-input" id="orden" min="0" value="0"></div>
          <div class="form-check"><input type="checkbox" class="form-check__input" id="activa" checked><label class="form-check__label" for="activa">Activa</label></div>
        </form>
      </div>
      <div class="modal__footer"><button class="btn btn--secondary" onclick="closeCategoriaModal()">Cancelar</button><button class="btn btn--primary" onclick="saveCategoria()">Guardar</button></div>
    </div>
  </div>

  <script type="module">
    import { isAuthenticated } from '../js/auth.js';
    import { supabase } from '../js/supabase-client.js';
    import { showToast, showConfirmModal } from '../js/ui.js';
    import { slugify } from '../js/utils.js';

    if (!isAuthenticated()) window.location.href = '/admin/login.html';
    window.toggleSidebar = () => document.getElementById('adminSidebar').classList.toggle('admin-sidebar--open');
    window.logout = () => { sessionStorage.removeItem('admin_session'); window.location.href = '/admin/login.html'; };

    let categorias = [];

    async function loadCategorias() {
      const { data } = await supabase.from('categorias').select('*').order('orden', { ascending: true });
      categorias = data || [];
      renderCategorias();
    }

    function renderCategorias() {
      const tbody = document.getElementById('categoriasTableBody');
      if (categorias.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No hay categorías</td></tr>'; return; }
      tbody.innerHTML = categorias.map(c => `<tr>
        <td>${c.nombre}</td>
        <td><code>${c.slug}</code></td>
        <td>${c.orden}</td>
        <td><span class="badge ${c.activa ? 'badge--success' : 'badge--danger'}">${c.activa ? 'Activa' : 'Inactiva'}</span></td>
        <td class="admin-table__actions">
          <button class="admin-table__btn admin-table__btn--edit" onclick="editCategoria('${c.id}')">✏️</button>
          <button class="admin-table__btn admin-table__btn--delete" onclick="deleteCategoria('${c.id}')">🗑️</button>
        </td>
      </tr>`).join('');
    }

    window.openCategoriaModal = () => { document.getElementById('categoriaForm').reset(); document.getElementById('categoriaId').value = ''; document.getElementById('modalTitle').textContent = 'Nueva Categoría'; document.getElementById('categoriaModal').style.display = 'flex'; };
    window.closeCategoriaModal = () => document.getElementById('categoriaModal').style.display = 'none';
    
    window.generarSlug = () => {
      const nombre = document.getElementById('nombre').value;
      document.getElementById('slug').value = slugify(nombre);
    };

    window.editCategoria = (id) => {
      const c = categorias.find(x => x.id === id);
      if (!c) return;
      document.getElementById('categoriaId').value = c.id;
      document.getElementById('nombre').value = c.nombre;
      document.getElementById('slug').value = c.slug;
      document.getElementById('descripcion').value = c.descripcion || '';
      document.getElementById('orden').value = c.orden;
      document.getElementById('activa').checked = c.activa;
      document.getElementById('modalTitle').textContent = 'Editar Categoría';
      document.getElementById('categoriaModal').style.display = 'flex';
    };

    window.saveCategoria = async () => {
      const id = document.getElementById('categoriaId').value;
      const data = {
        nombre: document.getElementById('nombre').value,
        slug: document.getElementById('slug').value,
        descripcion: document.getElementById('descripcion').value,
        orden: parseInt(document.getElementById('orden').value),
        activa: document.getElementById('activa').checked
      };
      let error;
      if (id) { const res = await supabase.from('categorias').update(data).eq('id', id); error = res.error; }
      else { const res = await supabase.from('categorias').insert([data]); error = res.error; }
      if (error) { showToast('Error guardando categoría', 'error'); }
      else { showToast('Categoría guardada', 'success'); closeCategoriaModal(); loadCategorias(); }
    };

    window.deleteCategoria = async (id) => {
      if (await showConfirmModal({ title: 'Eliminar', message: '¿Está seguro?', confirmText: 'Eliminar', type: 'danger' })) {
        const { error } = await supabase.from('categorias').delete().eq('id', id);
        if (error) showToast('Error eliminando', 'error');
        else { showToast('Categoría eliminada', 'success'); loadCategorias(); }
      }
    };

    document.addEventListener('DOMContentLoaded', loadCategorias);
  </script>
</body>
</html>
