<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Panel Admin</title>
  
  <!-- Estilos -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <!-- Tema claro/oscuro: se aplica ANTES de pintar para evitar flash (ver js/theme.js) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === 'dark') m.setAttribute('content', '#131712');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <a href="./dashboard.html" class="admin-sidebar__logo">🛒 Admin Panel</a>
      </div>
      
      <nav class="admin-sidebar__nav">
        <ul class="admin-nav__list">
          <li class="admin-nav__item">
            <a href="./dashboard.html" class="admin-nav__link active">
              <span class="admin-nav__icon">📊</span>
              Dashboard
            </a>
          </li>
          <li class="admin-nav__item">
            <a href="./productos.html" class="admin-nav__link">
              <span class="admin-nav__icon">📦</span>
              Productos
            </a>
          </li>
          <li class="admin-nav__item">
            <a href="./categorias.html" class="admin-nav__link">
              <span class="admin-nav__icon">📂</span>
              Categorías
            </a>
          </li>
          <li class="admin-nav__item">
            <a href="./configuracion.html" class="admin-nav__link">
              <span class="admin-nav__icon">⚙️</span>
              Configuración
            </a>
          </li>
          <li class="admin-nav__item">
            <a href="#" class="admin-nav__link" data-theme-toggle role="button" aria-label="Cambiar modo claro/oscuro">
              <span class="admin-nav__icon" data-theme-icon>🌙</span>
              <span data-theme-label>Modo oscuro</span>
            </a>
          </li>
          <li class="admin-nav__item" style="margin-top: 20px;">
            <a href="../" class="admin-nav__link" target="_blank">
              <span class="admin-nav__icon">🏪</span>
              Ver Tienda
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <button class="admin-sidebar-toggle" aria-label="Toggle sidebar" onclick="toggleSidebar()">
          ☰
        </button>
        <h1 class="admin-header__title">Dashboard</h1>
        <div class="admin-header__actions">
          <button class="btn btn--secondary logout-btn" onclick="logout()">
            🚪 Salir
          </button>
        </div>
      </header>

      <!-- Contenido del Dashboard -->
      <div class="container" style="padding: var(--spacing-6);">
        <!-- Stats Cards -->
        <div class="dashboard-stats" id="statsContainer">
          <div class="stat-card stat-card--primary">
            <div class="stat-card__header">
              <span class="stat-card__icon">📦</span>
            </div>
            <div class="stat-card__value" id="totalProductos">-</div>
            <p class="stat-card__label">Total Productos</p>
          </div>
          
          <div class="stat-card stat-card--secondary">
            <div class="stat-card__header">
              <span class="stat-card__icon">📂</span>
            </div>
            <div class="stat-card__value" id="totalCategorias">-</div>
            <p class="stat-card__label">Categorías</p>
          </div>
          
          <div class="stat-card stat-card--warning">
            <div class="stat-card__header">
              <span class="stat-card__icon">⚠️</span>
            </div>
            <div class="stat-card__value" id="productosSinStock">-</div>
            <p class="stat-card__label">Sin Stock</p>
          </div>
          
          <div class="stat-card stat-card--danger">
            <div class="stat-card__header">
              <span class="stat-card__icon">🏷️</span>
            </div>
            <div class="stat-card__value" id="productosDestacados">-</div>
            <p class="stat-card__label">Destacados</p>
          </div>
        </div>

        <!-- Alertas -->
        <div id="alertasContainer"></div>

        <!-- Accesos Rápidos -->
        <div class="admin-form" style="margin-top: var(--spacing-6);">
          <div class="admin-form__header">
            <h2 class="admin-form__title">Accesos Rápidos</h2>
          </div>
          <div style="display: flex; gap: var(--spacing-3); flex-wrap: wrap;">
            <a href="./productos.html" class="btn btn--primary">
              ➕ Nuevo Producto
            </a>
            <a href="./categorias.html" class="btn btn--secondary">
              📂 Gestionar Categorías
            </a>
            <a href="./configuracion.html" class="btn btn--secondary">
              ⚙️ Configurar Tienda
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { isAuthenticated, logout } from '../js/auth.js';
    import { supabase } from '../js/supabase-client.js';
    import { showToast } from '../js/ui.js';

    // Guard de autenticación
    if (!isAuthenticated()) {
      window.location.href = './login.html';
    }

    // Toggle sidebar en móvil
    window.toggleSidebar = () => {
      const sidebar = document.getElementById('adminSidebar');
      sidebar.classList.toggle('admin-sidebar--open');
    };

    // Logout
    window.logout = () => {
      sessionStorage.removeItem('admin_session');
      window.location.href = './login.html';
    };

    // Cargar estadísticas
    async function loadStats() {
      try {
        // Total productos
        const { count: productosCount } = await supabase
          .from('productos')
          .select('*', { count: 'exact', head: true });
        
        // Total categorías
        const { count: categoriasCount } = await supabase
          .from('categorias')
          .select('*', { count: 'exact', head: true });
        
        // Productos sin stock
        const { count: sinStockCount } = await supabase
          .from('productos')
          .select('*', { count: 'exact', head: true })
          .eq('stock', 0);
        
        // Productos destacados
        const { count: destacadosCount } = await supabase
          .from('productos')
          .select('*', { count: 'exact', head: true })
          .eq('destacado', true);
        
        // Actualizar UI
        document.getElementById('totalProductos').textContent = productosCount || 0;
        document.getElementById('totalCategorias').textContent = categoriasCount || 0;
        document.getElementById('productosSinStock').textContent = sinStockCount || 0;
        document.getElementById('productosDestacados').textContent = destacadosCount || 0;
        
        // Mostrar alertas si hay productos sin stock
        if (sinStockCount > 0) {
          mostrarAlertaSinStock(sinStockCount);
        }
      } catch (error) {
        console.error('Error cargando stats:', error);
        showToast('Error cargando estadísticas', 'error');
      }
    }

    function mostrarAlertaSinStock(count) {
      const container = document.getElementById('alertasContainer');
      container.innerHTML = `
        <div class="admin-alert admin-alert--warning">
          <strong>⚠️ Atención:</strong> Hay ${count} producto${count > 1 ? 's' : ''} sin stock. 
          <a href="./productos.html" style="color: #92400E; text-decoration: underline;">Revisar ahora</a>
        </div>
      `;
    }

    // Cargar al inicializar
    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
  <!-- Toggle de tema (panel admin): mismo mecanismo que js/theme.js -->
  <script>
    (function () {
      var ICONS = { light: '\u{1F319}', dark: '\u{2600}\u{FE0F}' };
      function current() {
        var t = document.documentElement.getAttribute('data-theme');
        return t === 'dark' ? 'dark' : 'light';
      }
      function paint() {
        var isDark = current() === 'dark';
        document.querySelectorAll('[data-theme-icon]').forEach(function (el) {
          el.textContent = isDark ? ICONS.dark : ICONS.light;
        });
        document.querySelectorAll('[data-theme-label]').forEach(function (el) {
          el.textContent = isDark ? 'Modo claro' : 'Modo oscuro';
        });
      }
      document.addEventListener('click', function (e) {
        var link = e.target.closest ? e.target.closest('[data-theme-toggle]') : null;
        if (!link) return;
        e.preventDefault();
        var next = current() === 'dark' ? 'light' : 'dark';
        document.documentElement.classList.add('theme-animations');
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (err) {}
        setTimeout(function () {
          document.documentElement.classList.remove('theme-animations');
        }, 400);
        paint();
      });
      paint();
    })();
  </script>
</body>
</html>
