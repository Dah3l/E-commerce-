<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Panel Admin</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <a href="./dashboard.html" class="admin-sidebar__logo">🛒 Admin Panel</a>
      </div>
      <nav class="admin-sidebar__nav">
        <ul class="admin-nav__list">
          <li class="admin-nav__item"><a href="./dashboard.html" class="admin-nav__link"><span class="admin-nav__icon">📊</span>Dashboard</a></li>
          <li class="admin-nav__item"><a href="./productos.html" class="admin-nav__link active"><span class="admin-nav__icon">📦</span>Productos</a></li>
          <li class="admin-nav__item"><a href="./categorias.html" class="admin-nav__link"><span class="admin-nav__icon">📂</span>Categorías</a></li>
          <li class="admin-nav__item"><a href="./configuracion.html" class="admin-nav__link"><span class="admin-nav__icon">⚙️</span>Configuración</a></li>
          <li class="admin-nav__item" style="margin-top: 20px;"><a href="../" class="admin-nav__link" target="_blank"><span class="admin-nav__icon">🏪</span>Ver Tienda</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú">☰</button>
        <h1 class="admin-header__title">Gestión de Productos</h1>
        <div class="admin-header__actions">
          <button class="btn btn--primary" id="btnNuevoProducto">➕ Nuevo Producto</button>
          <button class="btn btn--secondary logout-btn" id="btnLogout">🚪 Salir</button>
        </div>
      </header>

      <div class="container" style="padding: var(--spacing-6);">
        <div class="admin-filters">
          <input type="text" class="form-input admin-search" placeholder="Buscar productos..." id="searchInput">
          <select class="form-select" id="filtroCategoria" style="min-width: 200px;">
            <option value="">Todas las categorías</option>
          </select>
        </div>

        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productosTableBody">
              <tr><td colspan="7" style="text-align: center; padding: 40px;">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { isAuthenticated, logout } from '../js/auth.js';
    import { supabase, uploadImage, getStorageUrl, deleteImage } from '../js/supabase-client.js';
    import { showToast, showConfirmModal, showFormModal, escapeHtml } from '../js/ui.js';
    import { normalizeProduct, PRODUCT_SELECT_COLUMNS } from '../js/productos.js';
    import { clearConfigCaches } from '../js/config-negocio.js';

    if (!isAuthenticated()) window.location.href = './login.html';

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('adminSidebar').classList.toggle('admin-sidebar--open');
    });
    document.getElementById('btnLogout').addEventListener('click', logout);

    let categorias = [];
    let productos = [];
    // Config del negocio: moneda base + tasa CUP por 1 USD (para permitir
    // que el admin escriba los precios en USD o directamente en CUP)
    let bizConfig = {};
    // Moneda elegida en el formulario de producto (persiste entre aperturas del modal)
    let modalPriceCurrency = 'USD';

    async function loadBizConfig() {
      try {
        const { data } = await supabase.from('config_negocio').select('*').eq('id', 1).single();
        bizConfig = data || {};
      } catch (_) { bizConfig = {}; }
      setCupRate(bizConfig.tasa_cup);
    }

    function cupRate() {
      const n = parseFloat(String(bizConfig?.tasa_cup ?? '').replace(',', '.'));
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    // --- Helpers de conversión para el formulario de productos ---
    // La base de datos SIEMPRE guarda los precios en la moneda base (USD).
    function toBase(amount, fromCurrency) {
      const v = parseFloat(String(amount ?? '').replace(',', '.'));
      if (!Number.isFinite(v)) return NaN;
      if (fromCurrency === 'CUP') {
        const r = cupRate();
        if (!r) return NaN; // no debería ocurrir: el selector CUP solo aparece con tasa válida
        return Math.round((v / r) * 100) / 100;
      }
      return v;
    }
    function baseTo(baseAmount, toCurrency) {
      const v = Number(baseAmount);
      if (!Number.isFinite(v)) return '';
      if (toCurrency === 'CUP') {
        const r = cupRate();
        return r ? Math.round(v * r * 100) / 100 : v;
      }
      return v;
    }
    function fmtNum(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '-';
      return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: n % 1 === 0 ? 0 : 2 });
    }

    async function loadCategorias() {
      const { data, error } = await supabase.from('categorias').select('id, nombre').order('nombre');
      if (error) {
        console.error('Error cargando categorías:', error);
        showToast('No se pudieron cargar las categorías', 'error');
        return;
      }
      categorias = data || [];
      document.getElementById('filtroCategoria').innerHTML =
        '<option value="">Todas las categorías</option>' +
        categorias.map(c => `<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('');
    }

    // Estado de compatibilidad: si la BD aun no tiene la columna "codigo"
    // (no se ejecuto la migracion SQL), las consultas que la referencian
    // fallan. Lo detectamos una vez y a partir de ahi consultamos sin "codigo"
    // para que la lista de productos SIEMPRE se muestre.
    let bdSinColumnaCodigo = false;

    function esErrorColumnaCodigo(error) {
      const msg = String(error?.message || '');
      return /codigo/i.test(msg) && /column|does not exist|schema cache|42703|PGRST202/i.test(msg);
    }

    async function loadProductos() {
      const filtroCat = document.getElementById('filtroCategoria').value;
      const runQuery = () => {
        let q = supabase
          .from('productos')
          .select(bdSinColumnaCodigo ? PRODUCT_SELECT_COLUMNS.noCodigo : PRODUCT_SELECT_COLUMNS.conCodigo)
          .order('created_at', { ascending: false });
        if (filtroCat) q = q.eq('categoria_id', filtroCat);
        return q;
      };
      let { data, error } = await runQuery();
      if (error && !bdSinColumnaCodigo && esErrorColumnaCodigo(error)) {
        console.warn('La columna "codigo" no existe en la BD todavia. Ejecuta la migracion SQL (ver supabase-schema.sql). Cargando sin codigo...');
        bdSinColumnaCodigo = true;
        ({ data, error } = await runQuery());
      }
      if (error) {
        console.error('Error cargando productos:', error);
        showToast('No se pudieron cargar los productos: ' + (error.message || 'error desconocido'), 'error', 6000);
        return;
      }
      productos = (data || []).map(normalizeProduct);
      renderProductos();
    }

    function imageUrl(p) {
      if (!p.imagen_url) return '/assets/icons/placeholder.svg';
      // getStorageUrl maneja tanto rutas relativas como URLs completas de Supabase
      return getStorageUrl(p.imagen_url) || (String(p.imagen_url).startsWith('http') ? p.imagen_url : '/assets/icons/placeholder.svg');
    }

    function renderProductos() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = search
        ? productos.filter(p => (p.nombre || '').toLowerCase().includes(search) || String(p.codigo || '').toLowerCase().includes(search))
        : productos;
      const tbody = document.getElementById('productosTableBody');

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 40px;">${search ? 'Sin resultados para la búsqueda' : 'No hay productos. Crea el primero con "➕ Nuevo Producto".'}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const desc = (p.descripcion || '').replace(/\s+/g, ' ').trim();
        return `
        <tr>
          <td class="cell-img"><img src="${escapeHtml(imageUrl(p))}" alt="" loading="lazy" onerror="this.src='../assets/icons/placeholder.svg'"></td>
          <td>${p.codigo ? `<code>${escapeHtml(p.codigo)}</code>` : '<span style="color:#9CA3AF;">—</span>'}</td>
          <td class="cell-product">
            <div class="cell-product__name">${escapeHtml(p.nombre)}</div>
            ${desc ? `<div class="cell-product__desc" title="${escapeHtml(desc)}">${escapeHtml(desc)}</div>` : ''}
          </td>
          <td>${escapeHtml(p.categorias?.nombre || '-')}</td>
          <td class="admin-price">${(() => {
            const hasOffer = p.precio_oferta && p.precio_oferta < p.precio;
            const base = hasOffer ? p.precio_oferta : p.precio;
            const r = cupRate();
            const cup = r > 0 ? ` <small style="color:#6B7280;display:block;">≈ ${fmtNum(Math.round(base * r))} CUP</small>` : '';
            return (hasOffer ? `<del>$${Number(p.precio).toFixed(2)}</del>$${Number(p.precio_oferta).toFixed(2)}` : `$${Number(p.precio).toFixed(2)}`) + cup;
          })()}</td>
          <td><span class="badge ${p.stock === 0 ? 'badge--danger' : p.stock < 10 ? 'badge--warning' : 'badge--success'}">${p.stock ?? '-'}</span></td>
          <td><span class="badge ${p.activo ? 'badge--success' : 'badge--danger'}">${p.activo ? 'Activo' : 'Inactivo'}</span></td>
          <td class="admin-table__actions">
            <button class="admin-table__btn admin-table__btn--edit" data-edit="${p.id}" title="Editar" aria-label="Editar ${escapeHtml(p.nombre)}"><span class="admin-table__btn-icon">✏️</span><span class="admin-table__btn-text">Editar</span></button>
            <button class="admin-table__btn admin-table__btn--delete" data-delete="${p.id}" title="Eliminar" aria-label="Eliminar ${escapeHtml(p.nombre)}"><span class="admin-table__btn-icon">🗑️</span><span class="admin-table__btn-text">Eliminar</span></button>
          </td>
        </tr>
      `;}).join('');
    }

    // Delegación de eventos en la tabla (editar / eliminar)
    document.getElementById('productosTableBody').addEventListener('click', async (e) => {
      const editBtn = e.target.closest('[data-edit]');
      const delBtn = e.target.closest('[data-delete]');
      if (editBtn) openProductoModal(editBtn.dataset.edit);
      if (delBtn) deleteProducto(delBtn.dataset.delete);
    });

    document.getElementById('searchInput').addEventListener('input', renderProductos);
    document.getElementById('filtroCategoria').addEventListener('change', loadProductos);
    document.getElementById('btnNuevoProducto').addEventListener('click', () => openProductoModal());

    function productoFields(p = {}) {
      // El admin puede escribir los precios en USD (moneda base) o directamente
      // en CUP: al guardar, el valor en CUP se convierte a USD con la tasa del admin.
      const rate = cupRate();
      const canCup = rate > 0;
      const baseCur = (bizConfig?.moneda || 'USD').toUpperCase();
      // Moneda seleccionada para este modal (persiste entre aperturas de sesión).
      const selCur = (canCup && modalPriceCurrency === 'CUP') ? 'CUP' : baseCur;

      return [
        { id: 'codigo', label: 'Código (SKU)', type: 'text', value: p.codigo || '', placeholder: 'Ej: LEG-ASTR-001' },
        { id: 'nombre', label: 'Nombre', type: 'text', required: true, value: p.nombre || '' },
        { id: 'descripcion', label: 'Descripción', type: 'textarea', value: p.descripcion || '' },
        {
          id: 'precioMoneda', label: 'Moneda de los precios', type: 'select',
          options: canCup
            ? [{ value: baseCur, label: `${baseCur} (moneda base)` }, { value: 'CUP', label: `CUP (${fmtNum(rate)} CUP = 1 ${baseCur})` }]
            : [{ value: baseCur, label: `${baseCur} (moneda base)` }],
          value: selCur,
          hint: canCup
            ? `Puedes escribir los precios en ${baseCur} o en CUP. Se guardan en ${baseCur} usando la tasa configurada (1 ${baseCur} = ${fmtNum(rate)} CUP).`
            : `Configura la "Tasa de cambio: CUP por 1 USD" en Configuración para poder escribir los precios también en CUP.`,
          onChange: (values, setField) => {
            // Al cambiar la moneda, convertir los valores ya escritos a la nueva moneda.
            const to = values.precioMoneda === 'CUP' && canCup ? 'CUP' : baseCur;
            if (to === modalPriceCurrency) return;
            ['precio', 'precioOferta'].forEach(fid => {
              const raw = values[fid];
              if (raw === '' || raw === null || raw === undefined) return;
              const v = parseFloat(String(raw).replace(',', '.'));
              if (!Number.isFinite(v)) return;
              // valor actual -> moneda base -> moneda nueva
              const inBase = modalPriceCurrency === 'CUP' ? v / rate : v;
              const converted = to === 'CUP' ? inBase * rate : inBase;
              setField(fid, String(Math.round(converted * 100) / 100));
            });
            modalPriceCurrency = to;
          }
        },
        { id: 'precio', label: 'Precio', type: 'number', required: true, step: 'any', min: 0, value: baseTo(p.precio ?? '', selCur) },
        { id: 'precioOferta', label: 'Precio Oferta', type: 'number', step: 'any', min: 0, value: p.precio_oferta != null ? baseTo(p.precio_oferta, selCur) : '' },
        { id: 'stock', label: 'Stock', type: 'number', min: 0, value: p.stock ?? 0 },
        {
          id: 'categoriaId', label: 'Categoría', type: 'select',
          options: [{ value: '', label: '— Sin categoría —' }, ...categorias.map(c => ({ value: c.id, label: c.nombre }))],
          value: p.categoria_id || ''
        },
        { id: 'destacado', label: 'Marcar como destacado', type: 'checkbox', value: !!p.destacado },
        { id: 'activo', label: 'Activo (visible en la tienda)', type: 'checkbox', value: p.activo !== false },
        { id: 'imagenFile', label: 'Imagen', type: 'file', value: p.imagen_url || '', previewUrl: p.imagen_url ? imageUrl(p) : '' }
      ];
    }

    async function guardarProducto(values, existing) {
      let imagenUrl = existing?.imagen_url || '';
      let imageWarning = null;
      // "Quitar imagen" en el modal -> limpiar el campo.
      // IMPORTANTE: solo limpiar si NO se eligio un archivo nuevo. Si el usuario
      // subio una foto nueva, values.imagenFile es el File y debe conservarse.
      if (values.imagenFile === undefined && !values.imagenFile) {
        const oldPath = imagenUrl;
        imagenUrl = '';
        if (oldPath) deleteImage(oldPath); // mejor esfuerzo, ignora fallos
      }
      if (values.imagenFile) {
        const fileName = `${Date.now()}-${values.imagenFile.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
        const result = await uploadImage(values.imagenFile, fileName);
        if (result.error) {
          const msg = String(result.error.message || '');
          if (/row-level security|policy/i.test(msg)) {
            imageWarning = 'Storage te está bloqueando: en Supabase > Storage > bucket "productos" elimina las 2 políticas SELECT de "storage.objects" (son innecesarias en bucket público) y crea una política INSERT con check (bucket_id = \'productos\').';
          } else if (/not found/i.test(msg)) {
            imageWarning = 'No se encontró el bucket "productos". Verifica que se escriba exactamente así (minúsculas).';
          } else {
            imageWarning = 'La imagen no se pudo subir: ' + (msg || 'error desconocido');
          }
        } else {
          // Guardamos la RUTA relativa (no la URL) para que sea portable
          imagenUrl = result.path;
        }
      }

      const data = {
        codigo: String(values.codigo || '').trim() || null,
        nombre: values.nombre.trim(),
        descripcion: values.descripcion.trim() || null,
        // Los inputs pueden venir escritos en CUP: convertirlos a la moneda base (USD)
        precio: toBase(values.precio, values.precioMoneda),
        precio_oferta: values.precioOferta !== '' && values.precioOferta !== null ? toBase(values.precioOferta, values.precioMoneda) : null,
        stock: values.stock !== '' ? parseInt(values.stock, 10) : 0,
        categoria_id: values.categoriaId || null,
        destacado: !!values.destacado,
        activo: !!values.activo,
        imagen_url: imagenUrl || null
      };

      if (isNaN(data.precio)) return { error: 'El precio debe ser un número válido' };
      if (data.precio_oferta !== null && isNaN(data.precio_oferta)) return { error: 'El precio de oferta debe ser un número válido' };
      if (data.precio_oferta !== null && !(data.precio_oferta < data.precio)) {
        return { error: 'El precio de oferta debe ser menor que el precio normal' };
      }

      if (existing) {
        let { error } = await supabase.from('productos').update(data).eq('id', existing.id);
        // Reintento de compatibilidad: si la columna "codigo" aún no existe en la BD,
        // guardar sin ella para que el admin no falle hasta ejecutar la migración SQL.
        if (error && esErrorColumnaCodigo(error)) {
          delete data.codigo;
          bdSinColumnaCodigo = true;
          ({ error } = await supabase.from('productos').update(data).eq('id', existing.id));
        }
        if (error) {
          console.error(error);
          return { error: 'Error guardando cambios: ' + error.message };
        }
      } else {
        let { error } = await supabase.from('productos').insert([data]);
        if (error && esErrorColumnaCodigo(error)) {
          delete data.codigo;
          bdSinColumnaCodigo = true;
          ({ error } = await supabase.from('productos').insert([data]));
        }
        if (error) {
          if (/duplicate key|unique/i.test(error.message || '')) {
            return { error: 'Ya existe un producto con ese código. Usa uno distinto o déjalo vacío.' };
          }
          console.error(error);
          return { error: 'Error creando producto: ' + error.message };
        }
      }
      clearConfigCaches();
      if (imageWarning) showToast(imageWarning, 'warning', 6000);
      return {};
    }

    function openProductoModal(id = null) {
      const p = id ? productos.find(x => x.id === id) : null;
      showFormModal({
        title: p ? 'Editar Producto' : 'Nuevo Producto',
        fields: productoFields(p || {}),
        onSave: async (values) => {
          const result = await guardarProducto(values, p);
          if (!result.error) {
            showToast(p ? 'Producto actualizado ✓' : 'Producto creado ✓', 'success');
            loadProductos();
          }
          return result;
        }
      });
    }

    async function deleteProducto(id) {
      const p = productos.find(x => x.id === id);
      const ok = await showConfirmModal({
        title: 'Eliminar Producto',
        message: `¿Seguro que quieres eliminar "${p?.nombre || 'este producto'}"? Esta acción no se puede deshacer.`,
        confirmText: 'Eliminar',
        type: 'danger'
      });
      if (!ok) return;
      const { error } = await supabase.from('productos').delete().eq('id', id);
      if (error) {
        console.error(error);
        showToast('Error eliminando: ' + error.message, 'error');
      } else {
        if (p?.imagen_url) deleteImage(p.imagen_url); // limpiar el bucket (mejor esfuerzo)
        showToast('Producto eliminado', 'success');
        clearConfigCaches();
        loadProductos();
      }
    }

    async function init() {
      await loadBizConfig();
      modalPriceCurrency = (bizConfig?.moneda || 'USD').toUpperCase();
      await loadCategorias();
      await loadProductos();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
