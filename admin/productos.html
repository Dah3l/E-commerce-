<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Panel Admin</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar__header">
        <a href="/admin/dashboard.html" class="admin-sidebar__logo">🛒 Admin Panel</a>
      </div>
      <nav class="admin-sidebar__nav">
        <ul class="admin-nav__list">
          <li class="admin-nav__item"><a href="/admin/dashboard.html" class="admin-nav__link"><span class="admin-nav__icon">📊</span>Dashboard</a></li>
          <li class="admin-nav__item"><a href="/admin/productos.html" class="admin-nav__link active"><span class="admin-nav__icon">📦</span>Productos</a></li>
          <li class="admin-nav__item"><a href="/admin/categorias.html" class="admin-nav__link"><span class="admin-nav__icon">📂</span>Categorías</a></li>
          <li class="admin-nav__item"><a href="/admin/configuracion.html" class="admin-nav__link"><span class="admin-nav__icon">⚙️</span>Configuración</a></li>
          <li class="admin-nav__item" style="margin-top: 20px;"><a href="/" class="admin-nav__link" target="_blank"><span class="admin-nav__icon">🏪</span>Ver Tienda</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <button class="admin-sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <h1 class="admin-header__title">Gestión de Productos</h1>
        <div class="admin-header__actions">
          <button class="btn btn--primary" onclick="openProductoModal()">➕ Nuevo Producto</button>
          <button class="btn btn--secondary logout-btn" onclick="logout()">🚪 Salir</button>
        </div>
      </header>

      <div class="container" style="padding: var(--spacing-6);">
        <div class="admin-filters">
          <input type="text" class="form-input admin-search" placeholder="Buscar productos..." id="searchInput" onkeyup="searchProductos()">
          <select class="form-select" id="filtroCategoria" onchange="loadProductos()" style="min-width: 200px;">
            <option value="">Todas las categorías</option>
          </select>
        </div>

        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productosTableBody">
              <tr><td colspan="7" style="text-align: center; padding: 40px;">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Producto -->
  <div id="productoModal" class="modal-overlay" style="display: none;">
    <div class="modal" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Nuevo Producto</h2>
        <button class="modal__close" onclick="closeProductoModal()">&times;</button>
      </div>
      <div class="modal__body">
        <form id="productoForm">
          <input type="hidden" id="productoId">
          <div class="form-group">
            <label class="form-label form-label--required">Nombre</label>
            <input type="text" class="form-input" id="nombre" required>
          </div>
          <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea class="form-textarea" id="descripcion"></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-4);">
            <div class="form-group">
              <label class="form-label form-label--required">Precio</label>
              <input type="number" class="form-input" id="precio" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label class="form-label">Precio Oferta</label>
              <input type="number" class="form-input" id="precioOferta" step="0.01" min="0">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-4);">
            <div class="form-group">
              <label class="form-label">Stock</label>
              <input type="number" class="form-input" id="stock" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label">Categoría</label>
              <select class="form-select" id="categoriaId"></select>
            </div>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check__input" id="destacado">
            <label class="form-check__label" for="destacado">Marcar como destacado</label>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check__input" id="activo" checked>
            <label class="form-check__label" for="activo">Activo</label>
          </div>
          <div class="form-group" style="margin-top: var(--spacing-4);">
            <label class="form-label">Imagen</label>
            <input type="file" class="form-input" id="imagenFile" accept="image/*">
            <input type="hidden" id="imagenUrl">
          </div>
        </form>
      </div>
      <div class="modal__footer">
        <button class="btn btn--secondary" onclick="closeProductoModal()">Cancelar</button>
        <button class="btn btn--primary" onclick="saveProducto()">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { isAuthenticated } from '../js/auth.js';
    import { supabase, uploadImage } from '../js/supabase-client.js';
    import { showToast, showConfirmModal } from '../js/ui.js';
    import { slugify } from '../js/utils.js';

    if (!isAuthenticated()) window.location.href = '/admin/login.html';

    window.toggleSidebar = () => document.getElementById('adminSidebar').classList.toggle('admin-sidebar--open');
    window.logout = () => { sessionStorage.removeItem('admin_session'); window.location.href = '/admin/login.html'; };

    let categorias = [];
    let productos = [];

    async function loadCategorias() {
      const { data } = await supabase.from('categorias').select('id, nombre').order('nombre');
      categorias = data || [];
      const select = document.getElementById('filtroCategoria');
      const categoriaSelect = document.getElementById('categoriaId');
      select.innerHTML = '<option value="">Todas las categorías</option>' + categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      categoriaSelect.innerHTML = categorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    }

    async function loadProductos() {
      const filtroCat = document.getElementById('filtroCategoria').value;
      let query = supabase.from('productos').select('*, categorias(nombre)').order('created_at', { ascending: false });
      if (filtroCat) query = query.eq('categoria_id', filtroCat);
      const { data } = await query;
      productos = data || [];
      renderProductos();
    }

    function renderProductos() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = productos.filter(p => p.nombre.toLowerCase().includes(search));
      const tbody = document.getElementById('productosTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No hay productos</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(p => `
        <tr>
          <td><img src="${p.imagen_url || '/assets/icons/placeholder.svg'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
          <td>${p.nombre}</td>
          <td>${p.categorias?.nombre || '-'}</td>
          <td>$${p.precio.toFixed(2)}${p.precio_oferta ? ` <span style="color: var(--color-error); font-size: 12px;">($${p.precio_oferta.toFixed(2)})</span>` : ''}</td>
          <td><span class="badge ${p.stock === 0 ? 'badge--danger' : p.stock < 10 ? 'badge--warning' : 'badge--success'}">${p.stock}</span></td>
          <td><span class="badge ${p.activo ? 'badge--success' : 'badge--danger'}">${p.activo ? 'Activo' : 'Inactivo'}</span></td>
          <td class="admin-table__actions">
            <button class="admin-table__btn admin-table__btn--edit" onclick="editProducto('${p.id}')">✏️</button>
            <button class="admin-table__btn admin-table__btn--delete" onclick="deleteProducto('${p.id}')">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    window.searchProductos = renderProductos;

    window.openProductoModal = () => {
      document.getElementById('productoForm').reset();
      document.getElementById('productoId').value = '';
      document.getElementById('modalTitle').textContent = 'Nuevo Producto';
      document.getElementById('productoModal').style.display = 'flex';
    };

    window.closeProductoModal = () => document.getElementById('productoModal').style.display = 'none';

    window.editProducto = async (id) => {
      const p = productos.find(x => x.id === id);
      if (!p) return;
      document.getElementById('productoId').value = p.id;
      document.getElementById('nombre').value = p.nombre;
      document.getElementById('descripcion').value = p.descripcion || '';
      document.getElementById('precio').value = p.precio;
      document.getElementById('precioOferta').value = p.precio_oferta || '';
      document.getElementById('stock').value = p.stock;
      document.getElementById('categoriaId').value = p.categoria_id || '';
      document.getElementById('destacado').checked = p.destacado;
      document.getElementById('activo').checked = p.activo;
      document.getElementById('imagenUrl').value = p.imagen_url || '';
      document.getElementById('modalTitle').textContent = 'Editar Producto';
      document.getElementById('productoModal').style.display = 'flex';
    };

    window.saveProducto = async () => {
      const id = document.getElementById('productoId').value;
      const imagenFile = document.getElementById('imagenFile').files[0];
      let imagenUrl = document.getElementById('imagenUrl').value;
      
      if (imagenFile) {
        const fileName = `${Date.now()}-${imagenFile.name}`;
        const result = await uploadImage(imagenFile, fileName);
        if (result.url) imagenUrl = result.url;
      }

      const data = {
        nombre: document.getElementById('nombre').value,
        descripcion: document.getElementById('descripcion').value,
        precio: parseFloat(document.getElementById('precio').value),
        precio_oferta: parseFloat(document.getElementById('precioOferta').value) || null,
        stock: parseInt(document.getElementById('stock').value),
        categoria_id: document.getElementById('categoriaId').value || null,
        destacado: document.getElementById('destacado').checked,
        activo: document.getElementById('activo').checked,
        imagen_url: imagenUrl
      };

      let error;
      if (id) {
        const res = await supabase.from('productos').update(data).eq('id', id);
        error = res.error;
      } else {
        const res = await supabase.from('productos').insert([data]);
        error = res.error;
      }

      if (error) {
        showToast('Error guardando producto', 'error');
      } else {
        showToast('Producto guardado exitosamente', 'success');
        closeProductoModal();
        loadProductos();
      }
    };

    window.deleteProducto = async (id) => {
      if (await showConfirmModal({ title: 'Eliminar', message: '¿Está seguro?', confirmText: 'Eliminar', type: 'danger' })) {
        const { error } = await supabase.from('productos').delete().eq('id', id);
        if (error) showToast('Error eliminando', 'error');
        else { showToast('Producto eliminado', 'success'); loadProductos(); }
      }
    };

    document.addEventListener('DOMContentLoaded', () => { loadCategorias(); loadProductos(); });
  </script>
</body>
</html>
