<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto - Mi Tienda</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <!-- Tema claro/oscuro: se aplica ANTES de pintar para evitar flash (ver js/theme.js) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === 'dark') m.setAttribute('content', '#131712');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>



  <main id="main-content" class="site-main">
    <div class="container">
      <!-- Estado: cargando -->
      <div id="pdpLoading" class="section"><p>Cargando producto…</p></div>

      <!-- Estado: error / no encontrado -->
      <div id="pdpError" class="section" style="display:none; text-align:center; padding:48px 0;">
        <h2>Producto no encontrado 😕</h2>
        <p>Es posible que haya sido desactivado o que la dirección sea incorrecta.</p>
        <a href="./" class="btn btn--primary" style="margin-top:16px;">Volver a la tienda</a>
      </div>

      <!-- Producto -->
      <section id="pdpContent" class="product-detail" style="display:none;">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
          <a href="./">Inicio</a> / <a href="./#categorias" id="pdpCatLink">Categorías</a> / <span id="pdpCatName"></span>
        </nav>

        <div class="product-detail__layout">
          <div class="product-detail__main-image">
            <img id="pdpImage" src="" alt="">
          </div>

          <div class="product-detail__info">
            <div class="product-detail__code" id="pdpCode" style="display:none;"></div>
            <h1 class="product-detail__title" id="pdpTitle"></h1>
            <div class="product-detail__price-box">
              <span class="product-detail__price" id="pdpPrice"></span>
              <span class="product-detail__price-old" id="pdpOldPrice"></span>
              <span class="badge badge--offer" id="pdpOfferBadge" style="display:none;">OFERTA</span>
            </div>

            <div class="product-detail__stock" id="pdpStock"></div>

            <div class="product-detail__description-block">
              <h2 class="product-detail__description-title">Descripción</h2>
              <div class="product-detail__description" id="pdpDescription"></div>
            </div>

            <div class="product-detail__actions">
              <div class="quantity-selector">
                <button type="button" class="quantity-btn" id="qtyMinus" aria-label="Restar">−</button>
                <input type="number" class="quantity-input" id="qtyInput" value="1" min="1" aria-label="Cantidad">
                <button type="button" class="quantity-btn" id="qtyPlus" aria-label="Sumar">+</button>
              </div>
              <button type="button" class="btn btn--primary btn--lg" id="pdpAddToCart">Añadir al carrito</button>
              <button type="button" class="btn btn--secondary btn--lg" id="pdpBuyNow">Comprar por WhatsApp</button>
            </div>
          </div>
        </div>

        <section class="section" id="relatedSection" style="display:none;">
          <h2 class="section__title">Productos relacionados</h2>
          <div class="products-grid" id="relatedProducts"></div>
        </section>
      </section>
    </div>
  </main>



  <script type="module" src="./js/pages/producto-page.js"></script>

</body>
</html>
