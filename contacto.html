<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mi Tienda</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <main id="main-content" class="contact-page" role="main">
    <div class="container">
      <h1 class="section__title">Contacto</h1>
      <div class="contact-grid">
        <div class="contact-info" id="contactInfo">
          <div class="skeleton skeleton--text" style="height:200px;"></div>
        </div>
        <div class="contact-form-container">
          <h3>Envíanos un mensaje</h3>
          <p id="formHint" style="color:#6B7280; font-size:14px; margin-bottom:12px;">
            Tu mensaje se enviará por WhatsApp.
          </p>
          <form id="contactForm">
            <div class="form-group"><label class="form-label" for="cfNombre">Nombre</label><input type="text" id="cfNombre" class="form-input" required></div>
            <div class="form-group"><label class="form-label" for="cfEmail">Email</label><input type="email" id="cfEmail" class="form-input"></div>
            <div class="form-group"><label class="form-label" for="cfMensaje">Mensaje</label><textarea id="cfMensaje" class="form-textarea" required></textarea></div>
            <button type="submit" class="btn btn--primary btn--block" id="cfSubmit">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-nav">
    <a href="/" class="mobile-nav__item"><span class="mobile-nav__icon">🏠</span><span>Inicio</span></a>
    <a href="/#categorias" class="mobile-nav__item"><span class="mobile-nav__icon">📂</span><span>Categorías</span></a>
    <a href="/carrito.html" class="mobile-nav__item"><span class="mobile-nav__icon">🛒</span><span>Carrito</span></a>
    <a href="/contacto.html" class="mobile-nav__item active"><span class="mobile-nav__icon">📞</span><span>Contacto</span></a>
  </nav>

  <script type="module" src="/js/pages/contacto-page.js"></script>

</body>
</html>
