<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mi Tienda</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <main id="main-content" class="contact-page" role="main">
    <div class="container">
      <h1 class="section__title">Contacto</h1>
      <div class="contact-grid">
        <div class="contact-info" id="contactInfo">
          <div class="skeleton skeleton--text" style="height:200px;"></div>
        </div>
        <div class="contact-form-container">
          <h3>Envíanos un mensaje</h3>
          <p id="formHint" style="color:#6B7280; font-size:14px; margin-bottom:12px;">
            Tu mensaje se enviará por WhatsApp.
          </p>
          <form id="contactForm">
            <div class="form-group"><label class="form-label" for="cfNombre">Nombre</label><input type="text" id="cfNombre" class="form-input" required></div>
            <div class="form-group"><label class="form-label" for="cfEmail">Email</label><input type="email" id="cfEmail" class="form-input"></div>
            <div class="form-group"><label class="form-label" for="cfMensaje">Mensaje</label><textarea id="cfMensaje" class="form-textarea" required></textarea></div>
            <button type="submit" class="btn btn--primary btn--block" id="cfSubmit">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-nav">
    <a href="/" class="mobile-nav__item"><span class="mobile-nav__icon">🏠</span><span>Inicio</span></a>
    <a href="/#categorias" class="mobile-nav__item"><span class="mobile-nav__icon">📂</span><span>Categorías</span></a>
    <a href="/carrito.html" class="mobile-nav__item"><span class="mobile-nav__icon">🛒</span><span>Carrito</span></a>
    <a href="/contacto.html" class="mobile-nav__item active"><span class="mobile-nav__icon">📞</span><span>Contacto</span></a>
  </nav>

  <script type="module">
    import { initMobileMenu, showToast, escapeHtml, renderSiteHeader, renderSiteFooter } from './js/ui.js';
    import { getBizConfig, getWhatsAppNumber } from './js/config-negocio.js';

    let bizConfig = {};

    async function loadContactInfo() {
      const container = document.getElementById('contactInfo');
      try {
        bizConfig = await getBizConfig();
      } catch (_) { bizConfig = {}; }

      const c = bizConfig || {};
      const phone = getWhatsAppNumber(c);
      const rows = [
        ['📞', 'Teléfono', c.telefono],
        ['💬', 'WhatsApp', c.whatsapp ? (phone ? `<a href="https://wa.me/${phone}" target="_blank" rel="noopener">${escapeHtml(c.whatsapp)}</a>` : escapeHtml(c.whatsapp)) : null],
        ['✉️', 'Email', c.email ? `<a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a>` : null],
        ['📍', 'Dirección', c.direccion],
        ['🕐', 'Horario', c.horario]
      ];

      container.innerHTML = rows.map(([icon, title, value]) => `
        <div class="contact-card">
          <div class="contact-card__icon">${icon}</div>
          <div class="contact-card__content">
            <h3>${title}</h3>
            <p>${value || 'No disponible'}</p>
          </div>
        </div>
      `).join('');

      // Actualizar hint del formulario según lo configurado
      const hint = document.getElementById('formHint');
      const btn = document.getElementById('cfSubmit');
      if (phone) {
        hint.textContent = 'Tu mensaje se abrirá en WhatsApp listo para enviar.';
        btn.textContent = 'Enviar por WhatsApp';
      } else if (c.email) {
        hint.textContent = 'Tu mensaje se abrirá en tu aplicación de correo.';
        btn.textContent = 'Enviar Email';
      } else {
        hint.textContent = 'Aún no hay WhatsApp ni email configurados en la tienda.';
        btn.disabled = true;
      }
    }

    // Envío real: WhatsApp si hay número; si no, mailto; si no, aviso claro
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = document.getElementById('cfNombre').value.trim();
      const email = document.getElementById('cfEmail').value.trim();
      const mensaje = document.getElementById('cfMensaje').value.trim();
      if (!nombre || !mensaje) return;

      const c = bizConfig || {};
      const phone = getWhatsAppNumber(c);
      const body = [
        `¡Hola${c.nombre_negocio ? ' ' + c.nombre_negocio : ''}! 👋`,
        `Me llamo ${nombre}.`,
        '',
        mensaje,
        email ? `\n(Email de contacto: ${email})` : ''
      ].join('\n');

      if (phone) {
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(body)}`, '_blank');
        showToast('Se abrió WhatsApp con tu mensaje listo para enviar', 'success');
      } else if (c.email) {
        window.location.href = `mailto:${c.email}?subject=${encodeURIComponent('Contacto web: ' + nombre)}&body=${encodeURIComponent(body)}`;
      } else {
        showToast('La tienda no tiene WhatsApp ni email configurados', 'error');
        return;
      }
      e.target.reset();
    });

    async function init() {
      renderSiteHeader('contacto');
      initMobileMenu();
      await loadContactInfo();
      renderSiteFooter(bizConfig.nombre_negocio);
      if (bizConfig.nombre_negocio) {
        document.querySelectorAll('.header__logo').forEach(el => { el.textContent = `🛒 ${bizConfig.nombre_negocio}`; });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
