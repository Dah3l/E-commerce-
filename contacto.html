<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mi Tienda</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header class="site-header"><div class="container"><div class="header-main">
    <a href="/" class="header__logo">🛒 Mi Tienda</a>
    <button class="hamburger-btn" aria-label="Menú"><span></span><span></span><span></span></button>
    <a href="/carrito.html" class="header__cart"><span class="cart-icon">🛒</span><span class="cart-count" style="display:none;">0</span></a>
  </div></div></header>

  <main id="main-content" class="contact-page" role="main">
    <div class="container">
      <h1 class="section__title">Contacto</h1>
      <div class="contact-grid">
        <div class="contact-info" id="contactInfo">
          <div class="skeleton skeleton--text" style="height:200px;"></div>
        </div>
        <div class="contact-form-container">
          <h3>Envíanos un mensaje</h3>
          <form onsubmit="event.preventDefault(); alert('Mensaje enviado (demo)');">
            <div class="form-group"><label class="form-label">Nombre</label><input type="text" class="form-input" required></div>
            <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" required></div>
            <div class="form-group"><label class="form-label">Mensaje</label><textarea class="form-textarea" required></textarea></div>
            <button type="submit" class="btn btn--primary btn--block">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><div class="footer__bottom"><p>&copy; 2024 Mi Tienda Online</p></div></div></footer>
  <nav class="mobile-nav">
    <a href="/" class="mobile-nav__item"><span class="mobile-nav__icon">🏠</span><span>Inicio</span></a>
    <a href="/#categorias" class="mobile-nav__item"><span class="mobile-nav__icon">📂</span><span>Categorías</span></a>
    <a href="/carrito.html" class="mobile-nav__item"><span class="mobile-nav__icon">🛒</span><span>Carrito</span></a>
    <a href="/contacto.html" class="mobile-nav__item active"><span class="mobile-nav__icon">📞</span><span>Contacto</span></a>
  </nav>

  <script type="module">
    import { supabase } from './js/supabase-client.js';
    import { initMobileMenu } from './js/ui.js';
    
    initMobileMenu();
    
    async function loadContactInfo() {
      const { data } = await supabase.from('config_negocio').select('*').eq('id', 1).single();
      const container = document.getElementById('contactInfo');
      if (data) {
        container.innerHTML = `
          <div class="contact-card"><div class="contact-card__icon">📞</div><div class="contact-card__content"><h3>Teléfono</h3><p>${data.telefono || 'No disponible'}</p></div></div>
          <div class="contact-card"><div class="contact-card__icon">💬</div><div class="contact-card__content"><h3>WhatsApp</h3><p>${data.whatsapp || 'No disponible'}</p></div></div>
          <div class="contact-card"><div class="contact-card__icon">✉️</div><div class="contact-card__content"><h3>Email</h3><p>${data.email || 'No disponible'}</p></div></div>
          <div class="contact-card"><div class="contact-card__icon">📍</div><div class="contact-card__content"><h3>Dirección</h3><p>${data.direccion || 'No disponible'}</p></div></div>
          <div class="contact-card"><div class="contact-card__icon">🕐</div><div class="contact-card__content"><h3>Horario</h3><p>${data.horario || 'No disponible'}</p></div></div>
        `;
      } else {
        container.innerHTML = '<p>Información de contacto no disponible</p>';
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadContactInfo);
  </script>
</body>
</html>
