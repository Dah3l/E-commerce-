<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tienda online de comida y productos de aseo personal. Envíos a domicilio.">
  <meta name="theme-color" content="#6B8E23">
  
  <!-- Preconnect a Supabase para mejor rendimiento -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <title>Mi Tienda Online - Inicio</title>
  
  <!-- Estilos -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
  
  <!-- Favicon (opcional) -->
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
</head>
<body>
  <!-- Header, menú móvil y overlay se inyectan desde js/ui.js (renderSiteHeader).
       El mount DEBE ir ANTES que el contenido: renderSiteHeader rellena este div
       in situ, por lo que si estaba después de <main> el header aparecía abajo,
       pegado al footer. -->
  <div id="site-header-mount"></div>

  <!-- Skip link para accesibilidad -->
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  
  <!-- Contenido Principal -->
  <main id="main-content" role="main">
    <!-- Hero Section -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <h1 id="hero-title" class="hero__title">Bienvenido a Mi Tienda</h1>
        <p class="hero__subtitle">Productos de comida y aseo personal directamente a tu puerta</p>
        
        <!-- Buscador -->
        <form class="search-form hero__search" role="search" id="searchForm">
          <input 
            type="search" 
            class="search-input" 
            placeholder="Buscar productos..." 
            aria-label="Buscar productos"
            name="q"
          >
          <button type="submit" class="search-btn" aria-label="Buscar">
            🔍
          </button>
        </form>
      </div>
    </section>

    <!-- Filtros de Categoría -->
    <section class="section section--light" id="categorias" aria-labelledby="categories-title">
      <div class="container">
        <h2 id="categories-title" class="section__title">Categorías</h2>
        <div class="category-filters" role="group" aria-label="Filtros por categoría">
          <!-- Se carga dinámicamente desde JS -->
        </div>
      </div>
    </section>

    <!-- Productos Destacados (se oculta al realizar una búsqueda) -->
    <section class="section home-featured" id="featured-section" aria-labelledby="featured-title">
      <div class="container">
        <h2 id="featured-title" class="section__title">Productos Destacados</h2>
        <div class="products-grid" id="featured-products">
          <!-- Skeletons de carga -->
          <div class="product-card product-card--skeleton">
            <div class="product-card__image-container">
              <div class="skeleton skeleton--image"></div>
            </div>
            <div class="product-card__info">
              <div class="skeleton skeleton--text"></div>
              <div class="skeleton skeleton--text skeleton--text-short"></div>
              <div class="skeleton skeleton--btn"></div>
            </div>
          </div>
          <div class="product-card product-card--skeleton">
            <div class="product-card__image-container">
              <div class="skeleton skeleton--image"></div>
            </div>
            <div class="product-card__info">
              <div class="skeleton skeleton--text"></div>
              <div class="skeleton skeleton--text skeleton--text-short"></div>
              <div class="skeleton skeleton--btn"></div>
            </div>
          </div>
          <div class="product-card product-card--skeleton">
            <div class="product-card__image-container">
              <div class="skeleton skeleton--image"></div>
            </div>
            <div class="product-card__info">
              <div class="skeleton skeleton--text"></div>
              <div class="skeleton skeleton--text skeleton--text-short"></div>
              <div class="skeleton skeleton--btn"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Todos los Productos -->
    <section class="section section--border" aria-labelledby="all-products-title">
      <div class="container">
        <h2 id="all-products-title" class="section__title">Todos los Productos</h2>
        <div class="products-grid" id="all-products">
          <!-- Se carga dinámicamente desde JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script type="module" src="./js/pages/home.js"></script>

</body>
</html>
